[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-remote-sudo"
version = "0.1.0"
description = "Task-scoped remote Linux authority for MCP clients"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mcp-remote-sudo = "mcp_remote_sudo.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
